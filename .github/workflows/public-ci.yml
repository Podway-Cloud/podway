# Public CI for the OSS mirror (Podway-Cloud/podway). Runs on GitHub-hosted runners, which are
# FREE for public repos — so this is unaffected by any private-repo Actions billing.
#
# This file SHIPS to the public repo (the mirror excludes the private ci.yml / selfhost-images.yml /
# oss-mirror.yml, but keeps this one). Keep it self-contained: it must pass using only what the
# public tree contains, with no cloud secrets or infra.
#
# Scope: build every package, typecheck the web app, lint env manifests, and run the headless core
# unit tests. The PTY-bound suites (pod-agent, gateway) and the Playwright e2e need a live
# stack/tty and run upstream — they're intentionally out of this fast, always-green PR gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # This CI is for the PUBLIC mirror (Podway-Cloud/podway), where GitHub-hosted runners are FREE.
    # The guard below names the PRIVATE repo and MUST track its name. It read 'velsa/podbay' from the
    # 2026-09 rename until 2026-09-05, so it never matched and this job ran on the PRIVATE repo —
    # burning paid Actions minutes on exactly the work it exists to avoid.
    # On the private origin it is pure redundancy — ci.yml already runs the same build+test+typecheck
    # +lint on the self-hosted box (free) — and ubuntu-latest there BURNS metered minutes. So skip it
    # anywhere that isn't the public mirror.
    if: ${{ github.repository != 'velsa/podway' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages (tests + web typecheck consume their dist/)
        run: pnpm --filter "./packages/*" build
      - name: Typecheck web
        run: pnpm --filter @podway/web exec tsc --noEmit -p tsconfig.json
      - name: Unit tests (headless core)
        run: >
          pnpm --workspace-concurrency=1
          --filter @podway/control-plane
          --filter @podway/db
          --filter @podway/auth
          --filter @podway/shared
          --filter @podway/provider
          test
      - name: Lint environment manifests
        run: node scripts/lint-envs.mjs
