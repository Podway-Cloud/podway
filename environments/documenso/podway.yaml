apiVersion: podway/v0
name: documenso

# APP (the "Apps" tab): a self-hosted OSS app Podway DEPLOYS and KEEPS UPDATED for the user. The pod
# runs the app with `docker compose` (Docker is baked into the cloud pod-base image); the agent is its
# always-on admin. Scaffolded via scripts/incus/scaffold-app-env.mjs. minSize=mini: passes the full app-smoke at 1GB (swap 28%, restart+rollback ok), 2026-09-23.
kind: app
minSize: mini

metadata:
  title: "Documenso"
  # Short line adapted from the project's own README (https://github.com/documenso/documenso).
  # Folded block so a description containing a ": " (colon) stays valid YAML.
  description: >-
    The open-source DocuSign alternative: sign and send documents with legally-binding e-signatures.
  descriptionLong: >-
    Documenso is an open-source alternative to DocuSign for signing documents with legally-binding e-signatures. Upload a PDF, place fields, and send it for signature, all self-hosted so sensitive documents never leave your server.
  author: podway
  sourceUrl: https://github.com/documenso/documenso
  siteUrl: https://documenso.com
  tags: [self-host, oss, documents, e-signature, productivity]

base:
  devcontainer: .devcontainer/devcontainer.json

agents: [claude-code, codex]
shared: [universal]

# First-party, trusted env: the agent runs docker compose + the maintenance engine unprompted.
permissions:
  mode: bypassPermissions

network:
  policy: full

lifecycle: always-on

preview: private

setup:
  - >-
    if [ ! -f .env ]; then printf 'DOCUMENSO_IMAGE=%s\nDB_PASSWORD=%s\nNEXTAUTH_SECRET=%s\nENC_KEY=%s\nENC_KEY2=%s\nMAIN_URL=%s\n' "documenso/documenso:latest" "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(U=$(podway preview 2>/dev/null | grep -o 'https://[^ )]*' | head -1); echo "${U:-http://localhost:3000}")" > .env; chmod 600 .env; fi
  - chmod +x bin/app-admin.sh
  - >-
    if [ ! -f cert.p12 ]; then openssl req -x509 -newkey rsa:2048 -keyout /tmp/dk.pem -out /tmp/dc.pem -days 3650 -nodes -subj '/CN=Documenso' && openssl pkcs12 -export -out cert.p12 -inkey /tmp/dk.pem -in /tmp/dc.pem -passout pass: && chmod 644 cert.p12 && rm -f /tmp/dk.pem /tmp/dc.pem; fi
  - APP_ADMIN_DIR="$PWD" bin/app-admin.sh deploy

kickoff: |
  You are the always-on ADMIN for this person's own Documenso instance, deployed on THIS pod with
  `docker compose` and served on the pod's preview (port 3000). Keep it running, keep its data safe,
  and keep it up to date WITHOUT ever breaking it.

  What is already true when you start (the env's setup ran at first boot):
  - Docker is installed from the pod image; its data-root is on /home/dev, so the app's data survives a
    pod restart AND an image update. The stack is ~/work/compose.yaml with `restart: unless-stopped`.
  - Secrets (if any) live in ~/work/.env — NEVER commit or echo them.
  - The maintenance engine is ~/work/bin/app-admin.sh. Always run it with `APP_ADMIN_DIR=~/work`.

  First turn:
  1. Confirm health: `APP_ADMIN_DIR=~/work bin/app-admin.sh status` and open the preview. If it is up,
     tell the owner their Documenso is live and give them the preview link.
  2. Offer, don't assume: back up now? Keep it to 1-2 sharp questions.

  Ongoing duties:
  - BACKUPS before any risky change: `APP_ADMIN_DIR=~/work bin/app-admin.sh snapshot`.
  - UPGRADES: NEVER just `docker compose pull`. Use
    `APP_ADMIN_DIR=~/work bin/app-admin.sh safe-upgrade <tag>` — it snapshots, pulls, health-checks and
    AUTO-ROLLS-BACK code AND data if the new version is unhealthy. Apply only upgrades you class as SAFE.
  - If anything is unhealthy, restore the latest snapshot: `bin/app-admin.sh restore <snapshot-dir>`.

  END EVERY TURN ORIENTED: one line — "Documenso: <up/updating> · data: <backed-up when> · next: <thing>".
  Lead; only pause at real forks (a risky upgrade, deleting data, exposing the app publicly).
