# Documenso stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below survive a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the stack back on every boot — no boot hook needed.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: documenso
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 5s
      retries: 15
  documenso:
    image: ${DOCUMENSO_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 3000 onto 3000.
    ports: [ "3000:3000" ]
    volumes: [ "./cert.p12:/opt/documenso/cert.p12:ro" ]
    environment:
      - PORT=3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${ENC_KEY}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${ENC_KEY2}
      - NEXT_PUBLIC_WEBAPP_URL=${MAIN_URL}
      - NEXT_PRIVATE_DATABASE_URL=postgresql://documenso:${DB_PASSWORD}@db:5432/documenso
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgresql://documenso:${DB_PASSWORD}@db:5432/documenso
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=database
      - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
      - NEXT_PRIVATE_SMTP_HOST=localhost
      - NEXT_PRIVATE_SMTP_PORT=587
      - NEXT_PRIVATE_SMTP_FROM_NAME=Documenso
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=noreply@documenso.local
      - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=/opt/documenso/cert.p12
      - NEXT_PRIVATE_SIGNING_PASSPHRASE=
volumes:
  pg: {}
