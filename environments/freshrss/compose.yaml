# FreshRSS stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below survive a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the stack back on every boot — no boot hook needed.
services:
  freshrss:
    image: ${FRESHRSS_IMAGE}
    restart: unless-stopped
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 80 onto 3000.
    ports: [ "3000:80" ]
    volumes: [ "data:/var/www/FreshRSS/data" ]
volumes:
  data: {}
