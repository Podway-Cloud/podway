# Paca (AI-native Scrum board) for an app-pod — trimmed from upstream deploy/docker-compose.prod.yml
# (v0.18.6, Apache-2.0). Kept: postgres, valkey, rustfs (as root), api, web, realtime,
# gateway. Dropped: agent-runner (Paca's own LLM agents in Docker-in-Docker sandboxes — the pod's own
# Claude joins the board through Paca's MCP server instead) and db-backup (app-admin.sh snapshots).
# Docker's data-root is on the persistent /home/dev volume, so the named volumes survive a restart AND
# an image update; `restart: unless-stopped` brings the stack back on every boot.
name: paca

x-db-url: &db-url postgres://paca:${DB_PASSWORD}@postgres:5432/paca?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paca -d paca"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes: [ "valkey_data:/data" ]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  # Runs as root (upstream: uid 10001 + a one-shot chown container). Pod images before the boot-chown
  # fix re-own ~/.docker-data to uid 1000 on every boot, which locked uid 10001 out of its volume after
  # a restart (app-smoke 2026-10-07). Root inside this single-tenant pod VM sidesteps that for good.
  # The volume sits at /data itself, so the image's anonymous VOLUME /data is never created.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    user: root
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
    volumes: [ "rustfs_data:/data" ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 20

  api:
    image: pacaai/paca-api:${PACA_VERSION}
    restart: unless-stopped
    environment:
      ENV: production
      PORT: 8080
      DATABASE_URL: *db-url
      REDIS_URL: redis://valkey:6379/0
      JWT_SECRET: ${JWT_SECRET}
      # true behind the pod's HTTPS preview; false only on a plain-http scratch/smoke pod.
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: rustfs:9000
      STORAGE_PUBLIC_URL: ${MAIN_URL}/storage
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: paca
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_USE_SSL: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUBLIC_URL: ${MAIN_URL}
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      PLUGINS_SKILLS_DIR: /plugins-skills
      # The API refuses to start without these even when agent-runner is absent (v0.18.6: "config:
      # AI_AGENT_INTERNAL_KEY must be set"). Generated per pod; nothing listens at AI_AGENT_URL.
      AGENT_API_KEY: ${AGENT_API_KEY}
      AI_AGENT_URL: http://agent-runner:8080
      AI_AGENT_INTERNAL_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      rustfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - backend_plugins:/plugins
      - frontend_plugins:/plugins-frontend
      - mcp_plugins:/plugins-mcp
      - skills_plugins:/plugins-skills

  web:
    image: pacaai/paca-web:${PACA_VERSION}
    restart: unless-stopped
    depends_on: [ api ]

  realtime:
    image: pacaai/paca-realtime:${PACA_VERSION}
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      API_URL: http://api:8080
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: ${MAIN_URL}
      LOG_LEVEL: info
    depends_on:
      valkey: { condition: service_healthy }
      api: { condition: service_healthy }

  # The single entrypoint. The cockpit preview forwards ONLY port 3000 → publish Caddy's :80 there.
  # SITE_ADDRESS stays ":80" (plain HTTP): the pod's preview proxy already terminates TLS.
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "3000:80" ]
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_plugins:/var/www/plugins:ro
      - mcp_plugins:/var/www/plugins-mcp:ro
      - skills_plugins:/var/www/plugins-skills:ro
    depends_on: [ api, web, realtime ]

volumes:
  postgres_data: {}
  valkey_data: {}
  rustfs_data: {}
  backend_plugins: {}
  frontend_plugins: {}
  mcp_plugins: {}
  skills_plugins: {}
