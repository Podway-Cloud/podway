# Outline stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below survive a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the stack back on every boot — no boot hook needed.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: outline
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
  outline:
    image: ${OUTLINE_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 3000 onto 3000.
    ports: [ "3000:3000" ]
    volumes: [ "data:/var/lib/outline/data" ]
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - UTILS_SECRET=${UTILS_SECRET}
      - URL=${MAIN_URL}
      - DATABASE_URL=postgres://outline:${DB_PASSWORD}@postgres:5432/outline
      - PGSSLMODE=disable
      - REDIS_URL=redis://redis:6379
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - FORCE_HTTPS=false
      - NODE_ENV=production
volumes:
  pg: {}
  data: {}
