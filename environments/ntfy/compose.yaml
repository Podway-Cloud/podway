# ntfy stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volume below survives a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the service back on every boot — no boot hook needed.
services:
  ntfy:
    image: ${NTFY_IMAGE}
    restart: unless-stopped
    command: serve
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 80 onto 3000.
    ports: [ "3000:80" ]
    volumes: [ "data:/var/lib/ntfy" ]
    environment:
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_BEHIND_PROXY=true
volumes:
  data: {}
