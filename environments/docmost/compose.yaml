# Docmost stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below survive a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the stack back on every boot — no boot hook needed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: docmost
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
  docmost:
    image: ${DOCMOST_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 3000 onto 3000.
    ports: [ "3000:3000" ]
    volumes: [ "data:/app/data/storage" ]
    environment:
      - DATABASE_URL=postgresql://docmost:${DB_PASSWORD}@postgres:5432/docmost
      - REDIS_URL=redis://redis:6379
      - APP_SECRET=${APP_SECRET}
      - APP_URL=http://localhost:3000
volumes:
  pg: {}
  data: {}
