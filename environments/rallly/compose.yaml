# Rallly stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below survive a pod restart AND an image update.
# `restart: unless-stopped` makes docker bring the stack back on every boot — no boot hook needed.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rallly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rallly
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallly"]
      interval: 5s
      retries: 15
  rallly:
    image: ${RALLLY_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The cockpit preview forwards ONLY port 3000 → map the app's internal 3000 onto 3000.
    ports: [ "3000:3000" ]
    environment:
      - DATABASE_URL=postgresql://rallly:${DB_PASSWORD}@postgres:5432/rallly
      - SECRET_PASSWORD=${SECRET_PASSWORD}
      - NEXT_PUBLIC_BASE_URL=${MAIN_URL}
      - NEXTAUTH_URL=${MAIN_URL}
      - NOREPLY_EMAIL=noreply@rallly.local
      - SUPPORT_EMAIL=support@rallly.local
volumes:
  pg: {}
