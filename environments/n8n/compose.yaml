# The n8n stack for an app-pod. Docker is provided by the pod image with its data-root on the
# persistent /home/dev volume, so the named volumes below (Postgres data + the n8n data volume)
# survive a pod restart AND an image update. `restart: unless-stopped` makes docker itself bring the
# stack back on every boot — no boot hook needed.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      retries: 15
  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The cockpit preview forwards ONLY port 3000 → map n8n's 5678 onto 3000 so the editor shows up
    # on the pod's preview URL. Docker binds 0.0.0.0 by default (reachable by the preview proxy).
    ports: [ "3000:5678" ]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      # THE landmine: the encryption key is set explicitly and must NEVER change across upgrades, or
      # every stored credential becomes undecryptable. app-admin.sh pins its hash and refuses a change.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      # Bind all interfaces so the preview proxy reaches it. WEBHOOK_URL / N8N_EDITOR_BASE_URL are set
      # by the admin to the pod's preview URL when the owner wants working webhook links (a follow-up,
      # not needed for editor access).
      N8N_LISTEN_ADDRESS: "0.0.0.0"
    volumes: [ "n8n:/home/node/.n8n" ]
volumes:
  pg: {}
  n8n: {}
