# Postiz stack for an app-pod (TRIMMED: Temporal on Postgres, NO Elasticsearch — ~2.5GB idle vs the
# upstream 7-service stack). Docker's data-root is on the persistent /home/dev volume, so the named
# volumes below survive a pod restart AND an image update. `restart: unless-stopped` brings the stack
# back on every boot. MAIN_URL is the pod's PUBLIC preview URL, injected into .env at first-boot setup.
services:
  postiz-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postiz
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 5s
      retries: 20
  postiz-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  # Temporal (Postiz's scheduling engine) on the SAME Postgres — auto-setup creates its temporal +
  # temporal_visibility DBs there. Postgres visibility (no Elasticsearch) keeps the footprint tiny.
  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - DB_PORT=5432
      - POSTGRES_USER=postiz
      - POSTGRES_PWD=${DB_PASSWORD}
      - POSTGRES_SEEDS=postiz-postgres
  # One-shot: Postiz needs 2 custom Temporal search attributes (organizationId, postId, both Text), but
  # Temporal's Postgres visibility caps Text attributes at 3 and auto-setup pre-fills 2 (CustomTextField,
  # CustomStringField). Postiz adding 2 more → 4 > 3 → its addSearchAttributes throws UNCAUGHT in
  # onModuleInit, so the backend never binds and every /api route 502s (the frontend /auth still 200s,
  # which is why a frontend-only health check hid this). Fix, no Elasticsearch, no extra RAM: free the 2
  # unused default Text slots and pre-register Postiz's 2, BEFORE Postiz boots. Idempotent; attributes
  # persist in the temporal_visibility DB, so this is a no-op on later boots.
  temporal-init:
    image: temporalio/auto-setup:1.28.1
    restart: "no"
    depends_on:
      temporal:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until temporal operator search-attribute list --address temporal:7233 >/dev/null 2>&1; do
        echo "waiting for temporal..."; sleep 2; done;
        temporal operator search-attribute remove --address temporal:7233 --name CustomTextField --yes 2>/dev/null || true;
        temporal operator search-attribute remove --address temporal:7233 --name CustomStringField --yes 2>/dev/null || true;
        temporal operator search-attribute create --address temporal:7233 --name organizationId --type Text 2>/dev/null || true;
        temporal operator search-attribute create --address temporal:7233 --name postId --type Text 2>/dev/null || true;
        echo "temporal search attributes prepped (organizationId, postId as Text)";
  postiz:
    image: ${POSTIZ_IMAGE}
    restart: unless-stopped
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
      temporal-init:
        condition: service_completed_successfully
    # The cockpit preview forwards ONLY port 3000 → map Postiz's internal 5000 onto 3000.
    ports: [ "3000:5000" ]
    volumes: [ "config:/config/", "uploads:/uploads/" ]
    environment:
      - MAIN_URL=${MAIN_URL}
      - FRONTEND_URL=${MAIN_URL}
      - NEXT_PUBLIC_BACKEND_URL=${MAIN_URL}/api
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - TEMPORAL_ADDRESS=temporal:7233
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://postiz:${DB_PASSWORD}@postiz-postgres:5432/postiz
      - REDIS_URL=redis://postiz-redis:6379
      - IS_GENERAL=true
      - DISABLE_REGISTRATION=false
      - STORAGE_PROVIDER=local
      - UPLOAD_DIRECTORY=/uploads
      - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads
volumes:
  pg: {}
  config: {}
  uploads: {}
